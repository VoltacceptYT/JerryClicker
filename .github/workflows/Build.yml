name: Build Nintendo DS ROM

on:
  push:
    branches: [nds-port]
  pull_request:
    branches: [nds-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBNDS: /opt/devkitpro/libnds
      PORTLIBS: /opt/devkitpro/portlibs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify devkitPro NDS library
        run: |
          ls -l /opt/devkitpro/libnds/lib/libnds9.a
          test -f /opt/devkitpro/libnds/lib/libnds9.a

      - name: Install Pillow for sprite generation
        run: |
          apt-get update
          apt-get install -y python3-pil

      - name: Build Nintendo DS ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export LIBNDS=/opt/devkitpro/libnds
          export PORTLIBS=/opt/devkitpro/portlibs
          cd nds
          make clean
          make LIBNDS=/opt/devkitpro/libnds PORTLIBS=/opt/devkitpro/portlibs

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: jerryclicker-nds
          path: nds/jerryclicker.nds
          if-no-files-found: error
