name: Build Nintendo DS ROM

on:
  push:
    branches: [nds-port]
  pull_request:
    branches: [nds-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBNDS: /opt/devkitpro/libnds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify devkitPro libraries
        run: |
          test -f "$LIBNDS/lib/libnds9.a"
          echo "Found $LIBNDS/lib/libnds9.a"

      - name: Install Pillow
        run: |
          apt-get update
          apt-get install -y python3-pil

      - name: Build ROM
        run: |
          cd nds
          make clean
          make

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: jerryclicker-nds
          path: nds/jerryclicker.nds
          if-no-files-found: error
