name: Build Nintendo DS ROM

on:
  push:
    branches: [nds-port]
  pull_request:
    branches: [nds-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y git make python3 python3-pil

      - name: Build and install libnds from source
        shell: bash
        run: |
          set -eux
          git clone --depth 1 https://github.com/devkitPro/libnds.git /tmp/libnds
          make -C /tmp/libnds
          make -C /tmp/libnds install
          test -f "$DEVKITPRO/libnds/lib/libnds9.a"

      - name: Build JerryClicker NDS ROM
        shell: bash
        run: |
          set -eux
          cd nds
          make clean
          make

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: jerryclicker-nds
          path: nds/jerryclicker.nds
          if-no-files-found: error
