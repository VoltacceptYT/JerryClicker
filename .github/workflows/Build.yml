name: Build JerryClickerDS ROM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3-numpy python3-pil

      - name: Convert Assets
        run: python3 tools/convert_assets.py

      - name: Convert Music
        run: python3 tools/convert_music.py --rate 22050

      - name: Toolchain Layout (diagnostics)
        run: |
          echo "DEVKITPRO=$DEVKITPRO DEVKITARM=$DEVKITARM"
          make info

      - name: Build
        run: make

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: JerryClickerDS
          path: JerryClicker.nds
          if-no-files-found: error
