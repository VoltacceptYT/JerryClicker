name: Build Nintendo DS ROM

on:
  push:
    branches: [nds-port]
  pull_request:
    branches: [nds-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates python3 python3-pip
          python3 -m pip install --user Pillow

          curl -L -f --output install-devkitpro-pacman https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --needed --noconfirm nds-dev

      - name: Build JerryClicker NDS ROM
        shell: bash
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          set -eux
          cd nds
          make clean
          make

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: jerryclicker-nds
          path: nds/jerryclicker.nds
          if-no-files-found: error
