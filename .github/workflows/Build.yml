name: Build Nintendo DS ROM

on:
  push:
    branches: [nds-port]
  pull_request:
    branches: [nds-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependency for sprite generation
        shell: bash
        run: |
          set -eux
          python3 -m pip install --user Pillow

      - name: Build JerryClicker NDS ROM
        shell: bash
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          set -eux
          cd nds
          make clean
          make

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: jerryclicker-nds
          path: nds/jerryclicker.nds
          if-no-files-found: error
